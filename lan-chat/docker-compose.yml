services:
  lan-chat:
    build: .
    container_name: lan-chat
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.local
    environment:
      HOME: /home/openclaw
      GATEWAY_HOST: 127.0.0.1
    volumes:
      - /home/openclaw/.openclaw:/home/openclaw/.openclaw:ro
      - ./uploads:/app/public/uploads

  nginx:
    image: nginx:1.27-alpine
    container_name: lan-chat-nginx
    restart: unless-stopped
    depends_on:
      - lan-chat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
