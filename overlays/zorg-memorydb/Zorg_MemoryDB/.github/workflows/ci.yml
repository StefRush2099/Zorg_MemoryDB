name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: bash -n scripts/*.sh docker/entrypoint.sh

      - name: Compile Python tools
        run: python3 -m py_compile scripts/*.py

      - name: Validate Docker Compose
        run: docker compose config >/tmp/zorg-memorydb-compose.yml

      - name: Build single-container image
        run: docker build --build-arg OPENCLAW_VERSION=latest -t zorg-memorydb-openclaw:ci .
