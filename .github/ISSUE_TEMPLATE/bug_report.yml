name: Bug report
description: Report an install/runtime problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private memory rows, tokens, cookies, email contents, chat logs, or credentials.
  - type: dropdown
    id: install_path
    attributes:
      label: Install path
      options:
        - Standard Ubuntu
        - Docker Compose
        - Dockge
        - Docker run / GHCR
        - Existing OpenClaw migration
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host OS / version
      placeholder: Ubuntu 26.04 LTS
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands run
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error/output
      render: text
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification output
      description: Include output from memory_sql_tool / memory_recall_router if available.
      render: text
