<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zorg Memory 3D</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="graph"></section>
      <aside class="panel" aria-label="Zorg MemoryDB controls">
        <header>
          <p class="eyebrow">Zorg MemoryDB</p>
          <h1>Neural Recall Activity</h1>
          <p id="status">Connecting to PostgreSQL...</p>
        </header>

        <form id="searchForm" class="search">
          <input id="queryInput" type="search" autocomplete="off" placeholder="Run a recall query" />
          <button type="submit">Trace</button>
        </form>

        <div class="toolbar" role="group" aria-label="Graph filters">
          <button data-filter="all" class="active" type="button">All</button>
          <button data-filter="query" type="button">Queries</button>
          <button data-filter="rule" type="button">Rules</button>
          <button data-filter="activity" type="button">Activity</button>
        </div>

        <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false">Light View</button>

        <section class="metrics" id="metrics"></section>

        <section class="details">
          <h2>Selected Node</h2>
          <pre id="details">Click a node to inspect it.</pre>
        </section>

        <section class="activity">
          <h2>Live Stream</h2>
          <ol id="activity"></ol>
        </section>
      </aside>
    </main>

    <script src="/vendor/3d-force-graph/3d-force-graph.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
