services:
  lan-chat:
    build: .
    container_name: lan-chat
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      HOME: /home/openclaw
      GATEWAY_HOST: ${GATEWAY_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${OPENCLAW_HOME:-/home/openclaw/.openclaw}:/home/openclaw/.openclaw:ro
      - ./uploads:/app/public/uploads

  nginx:
    image: nginx:1.27-alpine
    container_name: lan-chat-nginx
    restart: unless-stopped
    depends_on:
      - lan-chat
    ports:
      - "${LAN_CHAT_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
